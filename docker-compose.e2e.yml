services:
  receiver:
    build: ./e2e/receiver
    ports:
      - "8090:8080"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/health') === false ? 1 : 0);"]
      interval: 2s
      timeout: 2s
      retries: 15
    restart: unless-stopped

  app:
    environment:
      WEBHOOK_ENDPOINTS: '[{"id":"acme","url":"http://receiver:8080/hook/acme","secret":"acme-shared-secret"},{"id":"beta","url":"http://receiver:8080/hook/beta","secret":"beta-shared-secret"}]'
    depends_on:
      receiver:
        condition: service_healthy

  worker:
    environment:
      WEBHOOK_ENDPOINTS: '[{"id":"acme","url":"http://receiver:8080/hook/acme","secret":"acme-shared-secret"},{"id":"beta","url":"http://receiver:8080/hook/beta","secret":"beta-shared-secret"}]'
    depends_on:
      receiver:
        condition: service_healthy
      app:
        condition: service_started
